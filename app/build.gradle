plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atlas.aiwebbuilder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atlas.aiwebbuilder'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Keep the source compatible with Java 8-based Android build environments.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
